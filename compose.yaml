# Local Docker test environment: DORA app + PostgreSQL with a persistent volume.
# For local testing only — production runs on Railway (see RAILWAY_DEPLOYMENT.md), not Compose.
#
#   docker compose up --build        # build and start (http://localhost:3000)
#   docker compose down              # stop (data is kept in the volume)
#   docker compose down -v           # stop and DELETE the local database volume
#
# The credentials below are throwaway values for this local database only.
name: dora

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: dora
      POSTGRES_PASSWORD: dora-local-only
      POSTGRES_DB: dora
    volumes:
      - dora-db:/var/lib/postgresql/data
    ports:
      # Bound to localhost only; lets `npm run test:db` or psql reach the container if needed.
      - "127.0.0.1:${DORA_DB_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dora -d dora"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  app:
    build: .
    image: dora:local
    environment:
      DATABASE_URL: postgresql://dora:dora-local-only@db:5432/dora?schema=public
      PORT: "3000"
    ports:
      - "${DORA_PORT:-3000}:3000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 5
    restart: unless-stopped

volumes:
  dora-db:
